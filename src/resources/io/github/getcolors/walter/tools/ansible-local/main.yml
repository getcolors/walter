---
# Walter's own copy of the local stage, not ONCE's.
#
# ONCE's playbook is reusable and walter copies it anyway: it writes to
# ~/.ssh/config on the operator's workstation, so reusing it would mean an
# unrelated change in ONCE — an added IdentityFile, a ProxyJump — rewriting that
# file at pin-bump time. Three files against that exposure is the wrong trade.
#
# The marker carries `walter`, so a collision with ONCE's block is impossible
# rather than merely unlikely: both packages derive their alias from `profile`,
# and nothing enforces that two projects chose different ones.
#
# Variables here are Ansible's, not Selmer's — they arrive as extra-vars. The
# one exception is the IdentityFile pair below, gated and filled by Selmer:
# whether the block names a key is desired state (compute-keygen), not
# something the play discovers, and a project without the feature should
# render a block that never mentions it.
#
# No ForwardAgent. Nothing on the machine authenticates with the
# workstation's keys any more — GitHub work rides the machine's own gh token
# over https — and forwarding an agent to a host that does not need it only
# widens what a compromise of that host can sign.
- name: Managed local configuration
  hosts: local
  tasks:
    - name: Manage SSH access for {{ host_alias }}
      ansible.builtin.blockinfile:
        path: ~/.ssh/config
        marker: "# {mark} walter {{ host_alias }} ANSIBLE MANAGED BLOCK"
        state: "{{ block_state | default('present') }}"
        create: yes
        mode: "0600"
        block: |
          Host {{ host_alias }}
              HostName {{ ip }}
              User {{ user }}
              Port 22
<% if machine-key-path|not-empty %>              IdentityFile <{ machine-key-path }>
              IdentitiesOnly yes
<% endif %>
