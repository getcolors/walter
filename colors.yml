# Desired state for a new Walter v2 development machine on Google Cloud.
# Credentials stay in COLORS_PAR_* environment variables. Never set COLORS_PAR_PROFILE.
profile: walter-google
workdir: .colors
compute-api-version: 2
users: [rose, jack]

provider-compute: google
provider-backend: r2
compute-prevent-destroy: true

# N4A requires ARM64, Hyperdisk and gVNIC. Image verified with IDPF support.
google-project: pocketcontext
google-region: europe-west4
google-zone: europe-west4-b
google-machine-type: n4a-highmem-1
google-boot-disk-type: hyperdisk-balanced
google-nic-type: GVNIC
google-image-project: ubuntu-os-cloud
google-image-family: ubuntu-2404-lts-arm64
google-image-id: projects/ubuntu-os-cloud/global/images/ubuntu-2404-noble-arm64-v20260918
google-subnet-cidr: 10.43.0.0/24
google-boot-disk-size-gb: 100

# Existing R2 bucket; credentials are supplied through .envrc.private.
r2-bucket: walter-google-state
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com

# Encrypted SSH resource: supply COLORS_PAR_WALTER_SSH_PASSPHRASE at runtime.
# Create/delete retain this named authority; each access scope owns an agent.
# This is a new deployment. No v1 resources or state are adopted.

# --- GitHub identity --------------------------------------------------------
# A real create starts GitHub's device flow before provisioning. The resulting
# machine-owned token is used for HTTPS clones; no GitHub SSH key or forwarded
# workstation agent reaches the server.
github-account: amiorin
git-email: 32617+amiorin@users.noreply.github.com

emacs-config-repo: https://github.com/amiorin/.emacs.d.git
emacs-config-dest: ~/.config/neoemacs

# --- Tooling ---------------------------------------------------------------
nix-packages:
  - asdf-vm
  - ripgrep
  - fd
  - fish
  - fzf
  - gh
  - caddy
  - awscli2
  - azure-cli
  - google-cloud-sdk
  - oci-cli
  - babashka
  - clojure
  - starship
  - zoxide
  - atuin
  - direnv
  - eza
  - zellij
  - gcc
  - devenv
  - age

agent-tools: [pi, codex, claude]

login-shell: fish

asdf-tools:
  - name: nodejs
    version: latest
    plugin: https://github.com/asdf-vm/asdf-nodejs.git
  - name: uv
    version: latest
    plugin: https://github.com/asdf-community/asdf-uv.git
  - name: bun
    version: latest
    plugin: https://github.com/cometkim/asdf-bun.git

  - name: python
    version: latest
    plugin: https://github.com/asdf-community/asdf-python.git

corepack-packages:
  - pnpm

dotfiles-checkout: ~/code/getcolors/dotfiles

clone-orgs:
  - getcolors

atuin-username: amiorin

seed-agent-credentials:
  - claude
  - codex
  - pi
