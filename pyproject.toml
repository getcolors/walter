[project]
name = "walter"
version = "3.0.0"
description = "Google Cloud and OCI development machines, using PocketDeploy"
requires-python = ">=3.11"
dependencies = ["pocketdeploy @ git+https://github.com/pocketcontext/pocketdeploy.git@3160c89b42d98d169579294bf92be2746712e536",
                "dotfiles @ git+https://github.com/getcolors/dotfiles.git@bb93c23a0077b7e924bdc3558e5840ba7a0d3e6b"]

[project.scripts]
walter = "walter.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/walter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
