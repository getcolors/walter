[project]
name = "walter"
version = "3.0.0"
description = "Google Cloud development machines, using PocketDeploy"
requires-python = ">=3.11"
dependencies = ["pocketdeploy @ git+https://github.com/pocketcontext/pocketdeploy.git@f910976d601b3aaec3bc8fab26126606968c198a"]

[project.scripts]
walter = "walter.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/walter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
