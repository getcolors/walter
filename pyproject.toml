[project]
name = "walter"
version = "3.0.0"
description = "Google Cloud and OCI development machines, using PocketDeploy"
requires-python = ">=3.11"
dependencies = [
    "pocketdeploy @ git+https://github.com/pocketcontext/pocketdeploy.git@3df198119b8a873e88ad6c45b7988e9c3981d39e",
    "dotfiles @ git+https://github.com/getcolors/dotfiles.git@2adb9df03e707c4b5f3f68eb665a4318c9c9ac11",
]

[project.scripts]
walter = "walter.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/walter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
