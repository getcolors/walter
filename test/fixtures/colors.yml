# One fixture, every provider variant. scripts/golden.sh renders this file with
# COLORS_PAR_* overrides for the keys that select a provider, so the goldens all
# describe the same desired state and cannot quietly drift apart from each other.
#
# Values are plausible but fictional. Nothing here is a credential.
profile: walter-fixture
workdir: .colors

provider-compute: oci
provider-backend: local

compute-prevent-destroy: true
power-wait-seconds: 300

# Set so every golden renders the derived key values and, on hcloud and
# digitalocean, the ssh-key.tf resource beside ONCE's main.tf. A build derives
# stable placeholders (generation is a create-time side effect), so the goldens
# stay byte-identical across workstations. With this on, the per-provider ssh
# key values below must be absent — walter derives them, and validate.clj
# refuses the combination. The absent branch — hand-supplied keys, exactly as
# before the feature — is covered once in tools_test and validate_test.
compute-keygen: true

oci-config-file-profile: DEFAULT
oci-subnet-id: ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaafixturesubnet
oci-compartment-id: ocid1.tenancy.oc1..aaaaaaaafixturecompartment
oci-availability-domain: XquT:EU-FRANKFURT-1-AD-1
oci-display-name: walter-fixture
oci-shape: VM.Standard.A2.Flex
oci-ocpus: 2
oci-memory-in-gbs: 12
oci-boot-volume-size-in-gbs: 100
oci-boot-volume-vpus-per-gb: 30

hcloud-name: walter-fixture
hcloud-image: ubuntu-24.04
hcloud-server-type: cx23
hcloud-location: hel1

digitalocean-name: walter-fixture
digitalocean-region: ams3
digitalocean-size: s-1vcpu-1gb-35gb-intel
digitalocean-image: ubuntu-25-10-x64
digitalocean-vpc-uuid: 00000000-0000-0000-0000-000000000000

vultr-name: walter-fixture
vultr-region: ams
vultr-plan: vc2-2c-4gb
vultr-os-id: 2284

yandex-cloud-id: b1gfixturecloud
yandex-folder-id: b1gfixturefolder
yandex-zone: ru-central1-a
yandex-image-family: ubuntu-2404-lts
yandex-name: walter-fixture
yandex-subnet-cidr: 10.0.0.0/24
yandex-platform-id: standard-v3
yandex-cores: 2
yandex-memory-gb: 8
yandex-core-fraction: 100
yandex-disk-size-gb: 50

no-infra-compute-ip: 198.51.100.10
no-infra-compute-user: root
no-infra-compute-sudoer: root
no-infra-compute-uid: 1000

s3-bucket: walter-fixture-state
s3-region: eu-central-1
r2-bucket: walter-fixture-state
r2-endpoint: https://fixture.eu.r2.cloudflarestorage.com

# Set so every golden renders the nix-packages step. Its absent branch is
# `the-remote-playbook-omits-nix-packages-when-none-are-named` in tools_test, for
# the same reason the Emacs one is: eight identical copies of an absence prove
# nothing eight times.
nix-packages:
  - asdf-vm
  - ripgrep
  - fish
  # Required by dotfiles-checkout below — its Green launcher is a bb script,
  # and validate.clj refuses the combination without it.
  - babashka
  # Likewise required by atuin-username below.
  - atuin

# Set so every golden renders the login-shell block and the fish integration that
# has to precede it. The other shells' branch — a login shell that reaches nix
# through /etc/profile.d/nix.sh and needs no extra file — is
# `only-fish-gets-the-extra-shell-integration` in tools_test.
login-shell: fish

# Set so every golden renders the asdf block and the corepack reshim behind it.
# The absent branch is `no-asdf-tools-means-no-asdf-tasks` in tools_test.
asdf-tools:
  - name: nodejs
    version: 24.18.1
    plugin: https://github.com/asdf-vm/asdf-nodejs.git

corepack-packages:
  - pnpm

# Set so every golden renders the github block: gh installed and logged in
# with the token the create acquired, git authenticating through it, and the
# commit identity configured. Every clone below rides this over https. Only
# the identity is desired state — the token is minted by the device flow at
# create time and never rendered, which is exactly what these goldens exist to
# hold still. The absent branch is
# `the-remote-playbook-omits-github-when-no-account-is-named` in tools_test.
github-account: fixture-user
git-email: fixture-user@example.com

# Set so every golden renders the Emacs half of the remote playbook. The other
# branch — no repository, no mention of Emacs — is not a golden: it is
# `the-remote-playbook-omits-emacs-when-no-repo-is-named` in tools_test, because
# eight identical copies of an absence prove nothing eight times. https, like
# every clone here: the machine authenticates with its own gh token, and
# validate.clj refuses the old ssh form.
emacs-config-repo: https://github.com/fixture/emacs.d.git
emacs-config-dest: ~/.config/fixture-emacs

# Set so every golden renders the dotfiles half. clone-orgs creates this
# checkout before Walter runs its existing Green launcher. The absent branch is
# covered once in tools_test rather than repeated across every provider golden.
dotfiles-checkout: ~/code/fixture-org/dotfiles

# Set so every golden renders the credential-seeding block, including the
# multi-agent loop. Nothing secret is involved: only the agent names are desired
# state, and the files they select are read from the operator's home directory
# at create time — which is exactly what these goldens exist to prove, since a
# token appearing under .colors/ would show up here as a diff. Naming Claude
# also renders its non-secret, missing-only onboarding repair. The absent branch
# is `the-remote-playbook-omits-agent-credentials-when-none-are-named` in
# tools_test.
seed-agent-credentials:
  - claude
  - codex
  - pi

# Set so every golden renders the organisation-checkout block, including the
# subelements loop that pairs each org with its own repositories. Only the org
# name is desired state — what gets cloned is read from GitHub on the machine at
# create time, which is exactly what these goldens exist to hold still: a
# rendered repository list would be a list gone stale. The absent branch is
# `the-remote-playbook-omits-org-clones-when-none-are-named` in tools_test.
clone-orgs:
  - fixture-org

# Set so every golden renders the atuin login. Only the username belongs in
# desired state — the password and the encryption key are COLORS_PAR_* secrets
# the playbook reads from the environment, which is exactly what these goldens
# exist to hold still. The absent branch is
# `the-remote-playbook-omits-atuin-when-no-username-is-named` in tools_test.
atuin-username: fixture-user
