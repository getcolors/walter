# Package-owned SSH config update. Connection facts arrive only as extra-vars.
# A persistent advisory lock serializes ownership checks and atomic BOF replacement.
- name: Manage the deployment SSH config block
  hosts: local
  connection: local
  gather_facts: false
  become: false
  vars:
    colors_keygen: true
  tasks:
    - name: Validate ownership and update SSH config under the shared lock
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/ssh_config.py"
        stdin: "{{ {'host_alias': host_alias, 'ssh_hosts': ssh_hosts, 'block_state': block_state, 'keygen': colors_keygen, 'identity_file': ssh_identity_file | default(''), 'legacy_marker_prefix': ssh_legacy_marker_prefix | default(''), 'installed': ssh_installed | default(false)} | to_json }}"
      environment:
        HOME: "{{ lookup('env', 'HOME') }}"
      register: colors_ssh_update
      changed_when: colors_ssh_update.stdout == 'changed'
