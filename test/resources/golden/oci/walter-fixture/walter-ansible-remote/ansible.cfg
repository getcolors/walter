[defaults]
allow_world_readable_tmpfiles = True
interpreter_python = auto_silent
inventory = inventory.json
host_key_checking = False
force_color = True
gathering = explicit

[ssh_connection]
ssh_args = -o IdentityAgent=/home/build-placeholder/agent.sock -o IdentitiesOnly=yes -o ForwardAgent=no -o ControlMaster=no -o ControlPersist=no -S none -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
